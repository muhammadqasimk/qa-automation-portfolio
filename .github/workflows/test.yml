name: Automation Suite

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
  schedule:
    - cron: '0 8 * * MON'

jobs:
  rest-assured-tests:
    name: Rest Assured API Tests (Restful-Booker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: maven

      - name: Run Rest Assured tests
        working-directory: ./rest-assured-tests
        run: mvn -B clean test

      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rest-assured-reports
          path: rest-assured-tests/target/surefire-reports/
          retention-days: 30

  playwright-tests:
    name: Playwright UI + E2E + API
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: playwright-tests/package-lock.json

      - name: Install dependencies
        working-directory: ./playwright-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./playwright-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright suite
        working-directory: ./playwright-tests
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-tests/playwright-report/
          retention-days: 30

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: playwright-tests/test-results/
          retention-days: 30
